image:
  name: garm-runner-almalinux-10-{{ image.architecture }}-{{ image.serial }}
  distribution: almalinux
  release: "10"
  description: GARM runner image based on AlmaLinux 10
  architecture: x86_64
  variant: cloud

source:
  downloader: almalinux-http
  url: https://repo.almalinux.org/almalinux
  variant: minimal
  skip_verification: true

files:
  - path: /etc/hostname
    generator: hostname
  - path: /etc/hosts
    generator: hosts
  - path: /etc/machine-id
    generator: dump
    content: uninitialized
  - path: /var/lib/dbus/machine-id
    generator: remove
  - path: /etc/NetworkManager/system-connections/eth0.nmconnection
    generator: dump
    mode: 0600
    content: |-
      [connection]
      id=eth0
      type=ethernet
      interface-name=eth0
      autoconnect=true

      [ipv4]
      method=auto

      [ipv6]
      method=auto
  - name: meta-data
    generator: cloud-init
  - name: network-config
    generator: cloud-init
  - name: user-data
    generator: cloud-init
  - name: vendor-data
    generator: cloud-init

packages:
  manager: dnf
  update: true
  cleanup: true
  repositories:
    - name: docker-ce
      url: |-
        [docker-ce-stable]
        name=Docker CE Stable - $basearch
        baseurl=https://download.docker.com/linux/centos/$releasever/$basearch/stable
        enabled=1
        gpgcheck=1
        gpgkey=https://download.docker.com/linux/centos/gpg
  sets:
    - action: install
      packages:
        - cloud-init
        - NetworkManager
        - systemd
        - dbus
        - sudo
        - glibc-langpack-en
        - curl
        - tar
        - gcc
        - gcc-c++
        - make
        - cmake
        - ninja-build
        - pkgconf-pkg-config
        - autoconf
        - automake
        - libtool
        - m4
        - bison
        - flex
        - clang
        - lld
        - llvm
        - llvm-devel
        - git
        - openssh-clients
        - wget
        - jq
        - file
        - rsync
        - unzip
        - zip
        - xz
        - zstd
        - bzip2
        - ca-certificates
        - gnupg2
        - python3
        - python3-pip
        - nodejs
        - npm
        - golang
        - rust
        - cargo
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin
        - openssl-devel
        - libffi-devel
        - zlib-devel
        - bzip2-devel
        - xz-devel
        - sqlite-devel
        - kmod
        - iproute
        - iputils
        - bind-utils
        - nmap-ncat
        - socat
        - ethtool
        - tcpdump
        - nftables

actions:
  - trigger: post-packages
    action: |-
      #!/bin/sh
      set -eu
      localedef -i en_US -f UTF-8 en_US.UTF-8 || true
      echo 'LANG=en_US.UTF-8' > /etc/locale.conf
      systemctl enable NetworkManager.service
      systemctl enable docker.service
      cloud-init clean --logs --machine-id
      dnf clean all
