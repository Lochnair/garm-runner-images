name: Build runner images

on:
  pull_request:
    paths:
      - images/**
      - scripts/**
      - systemd/**
      - .github/workflows/build.yml
  push:
    branches:
      - main
    paths:
      - images/**
      - scripts/**
      - systemd/**
      - .github/workflows/build.yml
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: garm-runner-image
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare image matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.catalog.outputs.matrix }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate updater script
        run: bash -n scripts/update-incus-images.sh

      - name: Validate image catalog
        id: catalog
        run: |
          set -euo pipefail

          matrix="$(
            python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          catalog_path = Path("images/catalog.json")
          catalog = json.loads(catalog_path.read_text())

          if catalog.get("schema_version") != 1:
              raise SystemExit("unsupported catalog schema")

          images = catalog.get("images")
          if not isinstance(images, list) or not images:
              raise SystemExit("catalog contains no images")

          safe_name = re.compile(r"[A-Za-z0-9][A-Za-z0-9._-]*")
          seen_ids = set()
          seen_assets = set()
          reserved_aliases = set()

          for image in images:
              image_id = image.get("id")
              definition = image.get("definition")
              asset = image.get("asset")
              alias = image.get("alias")

              if not all(isinstance(value, str) and value for value in (image_id, definition, asset, alias)):
                  raise SystemExit("catalog contains an invalid image entry")
              if not safe_name.fullmatch(image_id):
                  raise SystemExit(f"unsafe image id: {image_id!r}")
              if not safe_name.fullmatch(asset) or Path(asset).name != asset or not asset.endswith(".tar.xz"):
                  raise SystemExit(f"unsafe image asset: {asset!r}")
              if not safe_name.fullmatch(alias):
                  raise SystemExit(f"unsafe image alias: {alias!r}")
              if image_id in seen_ids or asset in seen_assets:
                  raise SystemExit("catalog contains duplicate ids or assets")
              if not Path(definition).is_file():
                  raise SystemExit(f"missing image definition: {definition}")

              aliases = (alias, f"{alias}-previous", f"{alias}-staging")
              if any(candidate in reserved_aliases for candidate in aliases):
                  raise SystemExit(f"catalog alias namespace collision for {alias}")

              seen_ids.add(image_id)
              seen_assets.add(asset)
              reserved_aliases.update(aliases)

          print(json.dumps({"include": images}, separators=(",", ":")))
          PY
          )"

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.id }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install distrobuilder
        run: |
          sudo snap install distrobuilder --classic
          /snap/bin/distrobuilder --version

      - name: Build Incus runner image
        env:
          IMAGE_ID: ${{ matrix.id }}
          DEFINITION: ${{ matrix.definition }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euxo pipefail

          build_dir="build-${IMAGE_ID}"
          mkdir -p "$build_dir" dist

          sudo /snap/bin/distrobuilder build-incus "$DEFINITION" "$build_dir" --type=unified --compression=xz

          image="$(find "$build_dir" -maxdepth 1 -type f -name '*.tar.xz' -print -quit)"
          test -n "$image"

          cp "$image" "dist/$ASSET"
          (
            cd dist
            sha256sum "$ASSET" > "$ASSET.sha256"
          )

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.id }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish image set
    if: ${{ github.event_name != 'pull_request' }}
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download image artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: dist
          merge-multiple: true

      - name: Build release manifest
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          catalog = json.loads(Path("images/catalog.json").read_text())
          images = []

          for image in catalog["images"]:
              checksum_path = Path("dist") / f'{image["asset"]}.sha256'
              checksum = checksum_path.read_text().split()[0]
              if len(checksum) != 64:
                  raise SystemExit(f"invalid checksum for {image['id']}")

              images.append({
                  "id": image["id"],
                  "asset": image["asset"],
                  "sha256": checksum,
                  "alias": image["alias"],
              })

          manifest = {
              "schema_version": 1,
              "source_commit": os.environ["SOURCE_COMMIT"],
              "images": images,
          }

          Path("dist/manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n"
          )
          PY

          cat dist/manifest.json

      - name: Publish image release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail

          tag="runner-images-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          gh release create "$tag" \
            dist/* \
            --target "$GITHUB_SHA" \
            --title "GARM runner images $(date -u '+%Y-%m-%d')" \
            --notes "Incus runner image set built from commit $GITHUB_SHA." \
            --draft

          gh release edit "$tag" --draft=false --latest
